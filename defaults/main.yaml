# defaults/main.yaml
# docker config
docker_network_name: "traefik"
docker_network_subnet: "172.23.27.0/24"
docker_network_gateway: "172.23.27.1"
restart_policy: unless-stopped
traefik_stepca_user: "{{ ansible_user | default(ansible_facts['user_id']) }}"

# step-ca config
stepca_enabled: true
stepca_docker_dir: "/home/{{ ansible_user }}/{{ stepca_container_name }}"
stepca_volume_name: "step-ca-data"
stepca_image: "smallstep/step-ca"
stepca_version: "latest"
stepca_container_name: "stepca"
stepca_init_name: "local-ca"
stepca_certificates_duration_hours: 2160
stepca_url: "ca.home.local"

# Traefik config
traefik_ip_address: "172.23.27.254"
traefik_bind_address: "0.0.0.0"
traefik_log_level: DEBUG
traefik_container_name: traefik
traefik_image: "traefik"
traefik_version: "latest"
traefik_docker_dir: "/home/{{ ansible_user }}/{{ traefik_container_name }}"
traefik_config_dir: "{{ traefik_docker_dir }}/config"
traefik_enable_dashboard: false
caserver_url: "https://{{  stepca_url }}:9000/acme/acme/directory"
acme_storage_le: "acme/acme-le.json"
acme_storage_stepca: "acme/acme-stepca.json"
acme_email: ""
acme_config_dir: "{{ traefik_docker_dir }}/acme"
letsencrypt_enabled: false
letsencrypt_staging_enabled: false
letsencrypt_url: "https://acme-v02.api.letsencrypt.org/directory"
letsencrypt_staging_url: "https://acme-staging-v02.api.letsencrypt.org/directory"

# Dashboard config
traefik_dashboard_url: "traefik.home.local"
traefik_dashboard_user: "admin"
traefik_dashboard_password_hash: "$$apr1$$CmiVRFjs$$rMXvR94BugiXwu0or8TIH1"  # admin:admin
