# molecule/letsencrypt-stagging/verify.yml
---
- name: Verify Traefik with Let's Encrypt staging
  hosts: all
  gather_facts: false
  vars:
    certificate_domain: "{{ traefik_dashboard_url }}"
  tasks:
- name: Verify Traefik with Let's Encrypt config
  hosts: all
  gather_facts: false
  vars:
    certificate_domain: "{{ traefik_dashboard_url }}"
  tasks:
    - name: Wait for Traefik healthcheck to pass
      community.docker.docker_container_info:
        name: "{{ traefik_container_name }}"
      register: traefik_info
      changed_when: false
      retries: 24
      delay: 5
      until:
        - traefik_info.container is defined
        - traefik_info.container.State.Health.Status is defined
        - traefik_info.container.State.Health.Status == 'healthy'

    - name: Check that the dashboard router answers over HTTPS
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --insecure
          - --resolve
          - "{{ certificate_domain }}:443:{{ traefik_ip_address }}"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - "https://{{ certificate_domain }}/dashboard/"
      register: dashboard_curl
      changed_when: false
      retries: 6
      delay: 5
      until: dashboard_curl.rc == 0 and dashboard_curl.stdout in ['200', '401']

      