# molecule/stepca/verify.yml
---
- name: Verify Traefik and step-ca
  hosts: all
  gather_facts: false
  vars:
    certificate_domain: "{{ traefik_dashboard_url }}"
    verify_dir: "{{ test_root }}/verify"
    root_certificate_path: "{{ verify_dir }}/root.crt"
  tasks:
    - name: Create the verification directory
      ansible.builtin.file:
        path: "{{ verify_dir }}"
        state: directory
        mode: "0755"

    - name: Wait for step-ca and Traefik healthchecks to pass
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop:
        - "{{ stepca_container_name }}"
        - "{{ traefik_container_name }}"
      register: containers_info
      changed_when: false
      retries: 24
      delay: 5
      until:
        - containers_info.container is defined
        - containers_info.container.State.Health.Status is defined
        - containers_info.container.State.Health.Status == 'healthy'

    - name: Assert containers are running and have not restarted
      ansible.builtin.assert:
        that:
          - item.container.State.Running
          - not item.container.State.Restarting
          - item.container.RestartCount == 0
        fail_msg: >-
          {{ item.item }}: running={{ item.container.State.Running }},
          restarting={{ item.container.State.Restarting }},
          restart_count={{ item.container.RestartCount }}
      loop: "{{ containers_info.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Copy the step-ca root certificate out of the CA container
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - "{{ stepca_container_name }}:/home/step/certs/root_ca.crt"
          - "{{ root_certificate_path }}"
      changed_when: false

    - name: Check the dashboard over HTTPS using the step-ca root
      block:
        - name: Request the dashboard through Traefik
          ansible.builtin.command:
            argv:
              - curl
              - --silent
              - --show-error
              - --cacert
              - "{{ root_certificate_path }}"
              - --resolve
              - "{{ certificate_domain }}:443:{{ traefik_ip_address }}"
              - --output
              - /dev/null
              - --write-out
              - "%{http_code}"
              - "https://{{ certificate_domain }}/dashboard/"
          register: dashboard_curl
          changed_when: false
          retries: 30
          delay: 5
          until:
            - dashboard_curl.rc == 0
            - dashboard_curl.stdout in ['200', '401']

